<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>imFEJM tvorba webu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:ital,wght@0,100;0,300;0,400;0,500;0,700;0,800;0,900;1,100;1,300;1,400;1,500;1,700;1,800;1,900&family=Cinzel:wght@400..900&family=Karla:ital,wght@0,200..800;1,200..800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <div class="line">
      <h1>
        <span class="visually-hidden">imFEJM tvorba webu</span>
      </h1>
      <a href="#bio">
        <img src="img/logoS.png" alt="logo imfejm small" class="logoS" />
      </a>
      <div class="menu">
        <div class="btn-wrapper">
          <button class="btn">
            <a href="#web" class="web" data-key="nav.web">
              <div class="txt-wrapper">
                <div class="txt-1">
                  <span class="btn-letter">c</span>
                  <span class="btn-letter">h</span>
                  <span class="btn-letter">c</span>
                  <span class="btn-letter">i</span>
                  <span class="btn-letter">&nbsp;</span>
                  <span class="btn-letter">w</span>
                  <span class="btn-letter">e</span>
                  <span class="btn-letter">b</span>
                </div>
              </div>
            </a>
          </button>
        </div>
        <div class="btn-wrapper">
          <button class="btn">
            <a href="#advice" class="advice" data-key="nav.advice">
              <div class="txt-wrapper">
                <div class="txt-1">
                  <span class="btn-letter">c</span>
                  <span class="btn-letter">h</span>
                  <span class="btn-letter">c</span>
                  <span class="btn-letter">i</span>
                  <span class="btn-letter">&nbsp;</span>
                  <span class="btn-letter">r</span>
                  <span class="btn-letter">a</span>
                  <span class="btn-letter">d</span>
                  <span class="btn-letter">u</span>
                </div>
              </div>
            </a>
          </button>
        </div>
        <div class="btn-wrapper">
          <button class="btn">
            <a href="#kontakt" class="kontakt" data-key="nav.kontakt">
              <div class="txt-wrapper">
                <div class="txt-1">
                  <span class="btn-letter">k</span>
                  <span class="btn-letter">o</span>
                  <span class="btn-letter">n</span>
                  <span class="btn-letter">t</span>
                  <span class="btn-letter">a</span>
                  <span class="btn-letter">k</span>
                  <span class="btn-letter">t</span>
                </div>
              </div>
            </a>
          </button>
        </div>
      </div>

      <div class="ham" id="ham">
        <div class="cara1" id="cara1"></div>
        <div class="cara2" id="cara2"></div>
        <div class="cara3" id="cara3"></div>
      </div>
    </div>

    <div class="navigace small hidden" id="menu">
      <ul class="nav">
        <li class="nav-item">
          <a class="nav-link" href="#web" data-key="nav.web">chci web</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#advice" data-key="nav.advice">chci radu</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#kontakt" data-key="nav.kontakt">kontakt</a>
        </li>
      </ul>
    </div>
    <div class="hero-section">
      <div class="background-container">
        <div class="glass-card">
          <p>Zvládnete to sami.</p>
          <p>Ale proč?</p>
          <div class="glassText">
            <p>Nechte to na nás.</p>
            <p>Ušetříte si čas i nervy.</p>
          </div>
          <button class="glassBtn">rovnou na nabídku imfejm webů</button>
          <div class="glass-gradient"></div>
        </div>
      </div>
      <video
        autoplay
        muted
        playsinline
        preload="metadata"
        class="video video-desktop"
      >
        <source src="img/hero.webm" type="video/webm" />
      </video>
      <video
        autoplay
        muted
        playsinline
        preload="metadata"
        class="video video-mobile"
      >
        <source src="img/heroMobile.webm" type="video/webm" />
      </video>
      <img src="img/imfejm_Banner.png" alt="imFEJM logo" class="stick" />
    </div>

    <script src="index.js" defer></script>
  </body>
</html>
